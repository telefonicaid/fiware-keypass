name: Java CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        java-version:
          - 11
          - 17
    steps:
      - uses: actions/checkout@v4
      - name: 'Set up JDK ${{ matrix.java-version }}'
        uses: actions/setup-java@v4
        with:
          java-version: '${{ matrix.java-version }}'
          distribution: 'temurin'
          cache: maven
      - name: Build with Maven
        run: mvn test
